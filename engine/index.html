<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">
  { "imports": { "@coderline/alphatab": "./alphatab/alphaTab.mjs" } }
</script>
<style>
  html, body { margin: 0; background: #FBFBF8; }
  /* A long press selects notes; it must not open the iOS text callout. */
  #score { position: relative; -webkit-user-select: none; -webkit-touch-callout: none; }
  /* alphaTab draws its playback cursor only when these are styled. */
  .at-cursor-bar { background: rgba(255, 242, 0, 0.25); }
  .at-selection div { background: rgba(61, 124, 255, 0.1); }
  .at-cursor-beat { background: rgba(61, 124, 255, 0.85); width: 3px; }
  .at-highlight * { fill: #3D7CFF; stroke: #3D7CFF; }
  .dt-edit-cursor { position: absolute; border: 2px solid #3D7CFF; border-radius: 3px; box-sizing: border-box; pointer-events: none; }
  .dt-note-moved { position: absolute; background: rgba(245, 166, 35, 0.4); border-radius: 3px; pointer-events: none; }
  .dt-note-unplayable { position: absolute; background: rgba(230, 60, 60, 0.4); border-radius: 3px; pointer-events: none; }
  .dt-bar-issue { position: absolute; background: rgba(230, 60, 60, 0.12); pointer-events: none; }
  .dt-bar-issue::after {
    content: attr(data-msg); position: absolute; top: -2px; right: 2px;
    font: 600 8pt -apple-system, system-ui, sans-serif; color: #c0392b;
  }
</style>
</head>
<body>
<div id="score"></div>
<script type="module" src="./engine.js"></script>
</body>
</html>
